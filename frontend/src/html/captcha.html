<!-- Bot check -->
<div id="captchaFormContainer" class="container my-5 text-left">
    <form id="captchaForm" name="captchaForm" onsubmit="return false">
        <p class="instructions">
            Please type the highlighted word, and only the highlighted word, in the response box below.
            Please be sure that capitalization is identical to the highlighted word.
        </p>
        <p class="text-center my-4" style="font-size: 1.1rem;">
            <mark id="captcha-word" style="background-color: #85fbe4; padding: 2px 6px; font-weight: bold;"></mark>
        </p>
        <input id="captchaAnswer" name="captchaAnswer" type="text" class="form-control response"
            autocomplete="off" spellcheck="false" style="max-width: 300px;">
        <div id="captcha-error" style="color: #e74c3c; font-size: 0.9rem; margin-top: 0.5rem; display: none;">
            Incorrect. Please type the highlighted word exactly as shown, matching capitalization.
        </div>
        <div id="captchaFormButtonContainer" class="container text-center my-5">
            <button id="continueButton" class="btn btn-lg btn-primary">Next</button>
        </div>
    </form>
</div>

<script>
(function () {
    var words = [
        "forest", "river", "candle", "puzzle", "bridge",
        "winter", "stone", "cloud", "table", "bright"
    ];
    var word = words[Math.floor(Math.random() * words.length)];
    document.getElementById("captcha-word").textContent = word;
    window._captchaWord = word;

    window.validateCaptchaForm = function () {
        var answer = document.getElementById("captchaAnswer").value;
        var errorEl = document.getElementById("captcha-error");
        if (answer === window._captchaWord) {
            errorEl.style.display = "none";
            return true;
        }
        errorEl.style.display = "block";
        return false;
    };
})();
</script>
